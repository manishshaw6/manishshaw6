<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">HUD dashboard</title>
  <desc id="desc">Glass panels for CPU, GPU, RAM, network, and AI with animated meters.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.t{font-family:JetBrains Mono, Consolas, monospace}.meter{fill:#00e5ff;filter:url(#glow)}.panel{fill:#061225;stroke:#00e5ff;stroke-opacity:.55}</style>
  </defs>
  <rect width="360" height="320" rx="18" fill="#020617" stroke="#00e5ff" stroke-opacity=".5"/>
  <text x="22" y="34" class="t" fill="#7df9ff" font-size="14">AI CORE // SYSTEM HEALTH</text>
  <g class="t" font-size="13">
    <g transform="translate(22 58)"><rect class="panel" width="316" height="40" rx="8"/><text x="14" y="25" fill="#fff">CPU</text><rect x="78" y="16" width="210" height="8" rx="4" fill="#fff" opacity=".08"/><rect class="meter" x="78" y="16" height="8" rx="4"><animate attributeName="width" values="80;170;130;205" dur="2.5s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(22 108)"><rect class="panel" width="316" height="40" rx="8"/><text x="14" y="25" fill="#fff">GPU</text><rect x="78" y="16" width="210" height="8" rx="4" fill="#fff" opacity=".08"/><rect class="meter" x="78" y="16" height="8" rx="4"><animate attributeName="width" values="120;210;155;190" dur="3s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(22 158)"><rect class="panel" width="316" height="40" rx="8"/><text x="14" y="25" fill="#fff">RAM</text><rect x="78" y="16" width="210" height="8" rx="4" fill="#fff" opacity=".08"/><rect class="meter" x="78" y="16" height="8" rx="4"><animate attributeName="width" values="60;150;110;180" dur="2.8s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(22 208)"><rect class="panel" width="316" height="40" rx="8"/><text x="14" y="25" fill="#fff">NET</text><rect x="78" y="16" width="210" height="8" rx="4" fill="#fff" opacity=".08"/><rect class="meter" x="78" y="16" height="8" rx="4"><animate attributeName="width" values="30;195;95;210" dur="2.2s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(22 258)"><rect class="panel" width="316" height="40" rx="8"/><text x="14" y="25" fill="#fff">AI</text><rect x="78" y="16" width="210" height="8" rx="4" fill="#fff" opacity=".08"/><rect class="meter" x="78" y="16" height="8" rx="4"><animate attributeName="width" values="180;205;160;210" dur="3.4s" repeatCount="indefinite"/></rect></g>
  </g>
</svg>
