<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Animated radar</title>
  <desc id="desc">Radar rings, grid, rotating sweep, and blinking targets.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff" stop-opacity=".75"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    <style>
      .sweep{transform-origin:180px 130px;animation:rot 4s linear infinite}
      .target{animation:blink 1.8s ease-in-out infinite}
      @keyframes rot{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.2}}
    </style>
  </defs>
  <rect width="360" height="260" rx="18" fill="#020617" stroke="#00e5ff" stroke-opacity=".55"/>
  <g stroke="#00e5ff" stroke-opacity=".18"><path d="M0 130H360M180 0V260"/><path d="M0 65H360M0 195H360M90 0V260M270 0V260"/></g>
  <g fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity=".55" filter="url(#glow)">
    <circle cx="180" cy="130" r="36"/><circle cx="180" cy="130" r="68"/><circle cx="180" cy="130" r="100"/>
  </g>
  <path class="sweep" d="M180 130 L180 28 A102 102 0 0 1 269 79 Z" fill="url(#sweep)" filter="url(#glow)"/>
  <g fill="#7df9ff" filter="url(#glow)">
    <circle class="target" cx="230" cy="86" r="5"/><circle class="target" cx="132" cy="170" r="4" style="animation-delay:-.6s"/><circle class="target" cx="205" cy="205" r="3" style="animation-delay:-1.2s"/>
  </g>
  <text x="22" y="36" fill="#80d8ff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">RADAR // ACTIVE</text>
</svg>
