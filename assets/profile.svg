<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
  <title id="title">Holographic profile card</title>
  <desc id="desc">Profile card with name, role, location, and live status styling.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#00e5ff" stop-opacity=".16"/><stop offset="1" stop-color="#020617" stop-opacity=".88"/></linearGradient>
    <style>.t{font-family:JetBrains Mono, Consolas, monospace}.o{font-family:Orbitron, Rajdhani, Arial, sans-serif}.scan{animation:scan 3s linear infinite}@keyframes scan{from{transform:translateY(-80px)}to{transform:translateY(330px)}}</style>
  </defs>
  <rect width="360" height="320" rx="18" fill="#020617" stroke="#00e5ff" stroke-opacity=".52"/>
  <rect x="24" y="28" width="312" height="264" rx="18" fill="url(#glass)" stroke="#7df9ff" stroke-opacity=".55"/>
  <circle cx="180" cy="98" r="52" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"/>
  <path d="M138 104c18-34 66-34 84 0M128 148c30-28 74-28 104 0" fill="none" stroke="#80d8ff" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="190" class="o" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">MANISH SHAW</text>
  <text x="180" y="218" class="t" text-anchor="middle" fill="#00e5ff" font-size="14">AI SYSTEMS ARCHITECT</text>
  <text x="180" y="246" class="t" text-anchor="middle" fill="#80d8ff" font-size="13">LOCATION: EARTH // IST</text>
  <text x="180" y="272" class="t" text-anchor="middle" fill="#7df9ff" font-size="13">STATUS: BUILDING</text>
  <rect class="scan" x="24" y="28" width="312" height="36" fill="#ffffff" opacity=".06"/>
</svg>
