<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" role="img" aria-label="Animated scanline">
  <defs><linearGradient id="line" y1="0" y2="1"><stop stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#7df9ff" stop-opacity=".85"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient></defs>
  <rect width="1200" height="90" fill="#020617"/>
  <rect y="-20" width="1200" height="20" fill="url(#line)">
    <animate attributeName="y" from="-20" to="90" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <path d="M0 45H1200" stroke="#00e5ff" stroke-opacity=".24"/>
</svg>
