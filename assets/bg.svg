<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Animated JARVIS background</title>
  <desc id="desc">Cyberpunk grid, circuit paths, scanlines, glow, and floating particles.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".32"/>
      <stop offset=".35" stop-color="#00bcd4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00e5ff" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H8" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dash{stroke-dasharray:18 18;animation:dash 8s linear infinite}
      .float{animation:float 6s ease-in-out infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-144}}
      @keyframes float{50%{transform:translateY(-16px);opacity:.45}}
      @keyframes pulse{50%{opacity:.9}}
    </style>
  </defs>
  <rect width="1200" height="360" fill="#020617"/>
  <rect width="1200" height="360" fill="url(#coreGlow)" class="pulse"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <g fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <path class="dash" d="M40 270H240L300 210H470L530 150H780L840 95H1130"/>
    <path class="dash" d="M80 90H230L275 135H395L445 88H610L685 165H1080"/>
    <path class="dash" d="M170 330L250 250H390L450 310H650L725 235H1010"/>
  </g>
  <g fill="#7df9ff" filter="url(#glow)">
    <circle class="float" cx="130" cy="130" r="3"/>
    <circle class="float" cx="310" cy="75" r="2" style="animation-delay:-1s"/>
    <circle class="float" cx="520" cy="230" r="3" style="animation-delay:-2s"/>
    <circle class="float" cx="750" cy="120" r="2" style="animation-delay:-3s"/>
    <circle class="float" cx="980" cy="260" r="3" style="animation-delay:-4s"/>
    <circle class="float" cx="1115" cy="84" r="2" style="animation-delay:-5s"/>
  </g>
  <rect width="1200" height="360" fill="url(#scan)">
    <animate attributeName="y" from="-8" to="8" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="50%" y="50%" text-anchor="middle" fill="#ffffff" fill-opacity=".92" font-family="Orbitron, Rajdhani, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="4">JARVIS PROFILE OS</text>
  <text x="50%" y="62%" text-anchor="middle" fill="#80d8ff" font-family="JetBrains Mono, Consolas, monospace" font-size="15">NEURAL INTERFACE // ARC REACTOR STABLE // HUD ONLINE</text>
</svg>
