<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated terminal</title>
  <desc id="desc">Glass terminal with boot log, cursor, and animated progress bars.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#00e5ff" stop-opacity=".13"/><stop offset="1" stop-color="#020617" stop-opacity=".9"/></linearGradient>
    <style>.mono{font-family:JetBrains Mono, Consolas, monospace}.bar{fill:#00e5ff;filter:url(#glow)}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style>
  </defs>
  <rect x="8" y="8" width="944" height="304" rx="22" fill="url(#glass)" stroke="#00e5ff" stroke-opacity=".7"/>
  <rect x="28" y="28" width="904" height="42" rx="12" fill="#020617" stroke="#00e5ff" stroke-opacity=".38"/>
  <circle cx="56" cy="49" r="6" fill="#00e5ff"/><circle cx="78" cy="49" r="6" fill="#00bcd4"/><circle cx="100" cy="49" r="6" fill="#80d8ff"/>
  <text x="126" y="55" class="mono" fill="#7df9ff" font-size="15">jarvis://profile-os/boot.log</text>
  <g class="mono" font-size="17" fill="#ffffff">
    <text x="44" y="112">[OK] ARC REACTOR ONLINE</text>
    <text x="44" y="150">[OK] NEURAL ROUTER SYNCHRONIZED</text>
    <text x="44" y="188">[OK] PROJECT INDEX COMPILED</text>
    <text x="44" y="226">[OK] CYBERNETIC UI MATRIX READY</text>
    <text x="44" y="264" fill="#00e5ff">SYSTEM STATUS: AVAILABLE<tspan class="cursor">_</tspan></text>
  </g>
  <g transform="translate(560 104)">
    <text class="mono" x="0" y="0" fill="#80d8ff" font-size="14">CORE</text>
    <rect y="12" width="310" height="10" rx="5" fill="#ffffff" opacity=".08"/><rect class="bar" y="12" height="10" rx="5"><animate attributeName="width" values="30;255;220;290" dur="3s" repeatCount="indefinite"/></rect>
    <text class="mono" x="0" y="54" fill="#80d8ff" font-size="14">NETWORK</text>
    <rect y="66" width="310" height="10" rx="5" fill="#ffffff" opacity=".08"/><rect class="bar" y="66" height="10" rx="5"><animate attributeName="width" values="60;210;300;185" dur="3.8s" repeatCount="indefinite"/></rect>
    <text class="mono" x="0" y="108" fill="#80d8ff" font-size="14">BUILD</text>
    <rect y="120" width="310" height="10" rx="5" fill="#ffffff" opacity=".08"/><rect class="bar" y="120" height="10" rx="5"><animate attributeName="width" values="20;145;260;310" dur="4.4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
